<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Painel — Controle do Almoxarifado</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --azul: #2563eb;
      --azul-escuro: #1e40af;
      --azul-claro: #eff6ff;
      --fundo: #f5f7fb;
      --texto: #172033;
      --cinza: #64748b;
      --borda: #e2e8f0;
      --branco: #ffffff;
      --verde: #16a34a;
      --amarelo: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.05);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    h3 {
      font-size: 16px;
      line-height: 1.4;
      margin: 0 0 16px;
    }

    p {
      color: var(--cinza);
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid var(--borda);
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: var(--azul);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--azul-escuro);
    }

    .secondary {
      background: #e8eefc;
      color: var(--azul-escuro);
    }

    .secondary:hover {
      background: #dbe7ff;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top p {
      margin: 5px 0 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .summary {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 15px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }

    .summary-number {
      display: block;
      font-size: 30px;
      font-weight: bold;
      color: var(--azul);
      margin-bottom: 5px;
    }

    .summary-label {
      color: var(--cinza);
      font-size: 14px;
    }

    .filters {
  display: grid;
  grid-template-columns: 220px 180px 1fr;
  gap: 10px;
  align-items: center;
}

    .filters select,
    .filters input {
      margin: 0;
    }

    .question-card {
      border: 1px solid var(--borda);
      border-radius: 13px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
    }

    .barrow {
      margin: 12px 0;
    }

    .bar-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .bar-label {
      color: var(--texto);
      word-break: break-word;
    }

    .bar-value {
      color: var(--azul);
      font-weight: bold;
      white-space: nowrap;
    }

    .bar-background {
      width: 100%;
      height: 9px;
      background: #e8eefc;
      border-radius: 20px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--azul);
      border-radius: 20px;
    }

    .person {
      border: 1px solid var(--borda);
      border-radius: 12px;
      margin-bottom: 10px;
      background: white;
      overflow: hidden;
    }

    .person summary {
      cursor: pointer;
      padding: 15px;
      list-style: none;
    }

    .person summary::-webkit-details-marker {
      display: none;
    }

    .person summary::after {
      content: "＋";
      float: right;
      color: var(--azul);
      font-weight: bold;
    }

    .person[open] summary::after {
      content: "−";
    }

    .person-content {
      padding: 0 15px 15px;
      border-top: 1px solid var(--borda);
    }

    .answer {
      padding: 12px 0;
      border-bottom: 1px solid #eef2f7;
      font-size: 14px;
      line-height: 1.5;
    }

    .answer:last-child {
      border-bottom: 0;
    }

    .answer b {
      color: var(--texto);
    }

    .stage {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 5px;
    }

    .stage-antes {
      background: #fff7ed;
      color: var(--amarelo);
    }

    .stage-depois {
      background: #f0fdf4;
      color: var(--verde);
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: var(--cinza);
    }

    .login-title {
      text-align: center;
    }

    #loginStatus {
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 16px;
        border-radius: 13px;
      }

      h1 {
        font-size: 22px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .top button {
        padding: 10px 13px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <!-- LOGIN -->
  <section class="card" id="loginBox">

    <div class="login-title">
      <h1>📦 Controle do Almoxarifado</h1>
      <p>Painel administrativo do TCC</p>
    </div>

    <input
      id="email"
      type="email"
      placeholder="E-mail"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Senha"
      autocomplete="current-password"
    >

    <button id="login" style="width:100%;">
      Entrar
    </button>

    <p id="loginStatus"></p>

  </section>


  <!-- PAINEL -->
  <section id="dashboard" style="display:none;">

    <!-- CABEÇALHO -->
    <div class="card">

      <div class="top">

        <div>
          <h1>📊 Painel de respostas</h1>
          <p id="count">Carregando...</p>
        </div>

        <button id="logout" class="secondary">
          Sair
        </button>

      </div>

    </div>


    <!-- RESUMO -->
    <div class="stats-grid">

      <div class="summary">
        <span class="summary-number" id="totalResponses">0</span>
        <span class="summary-label">Total de respostas</span>
      </div>

      <div class="summary">
        <span class="summary-number" id="beforeResponses">0</span>
        <span class="summary-label">Respostas ANTES</span>
      </div>

      <div class="summary">
        <span class="summary-number" id="afterResponses">0</span>
        <span class="summary-label">Respostas DEPOIS</span>
      </div>

    </div>


    <!-- FILTROS -->
    <div class="card">

      <h2>🔎 Filtrar respostas</h2>

      <div class="filters">

  <select id="personFilter">
    <option value="todos">
      Todos os participantes
    </option>
  </select>

  <select id="stageFilter">
    <option value="todos">Todas as etapas</option>
    <option value="antes">Antes</option>
    <option value="depois">Depois</option>
  </select>

  <input
    id="search"
    placeholder="Pesquisar pelo nome..."
  >

</div>

    </div>


    <!-- RESULTADOS -->
    <div class="card">

      <h2>📈 Resultados</h2>

      <div id="stats"></div>

    </div>


    <!-- PESSOAS -->
    <div class="card">

      <h2>👥 Respostas individuais</h2>

      <div id="people"></div>

    </div>

  </section>

</main>


<script src="config.js"></script>
<script src="questions.js"></script>
<script src="admin.js"></script>

</body>
</html>
